name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies for reservation_service
      run: |
        cd reservation_service
        pip install -r requirements.txt

    - name: Run tests for reservation_service
      run: |
        cd reservation_service
        python manage.py test

    - name: Install dependencies for salle_service
      run: |
        cd salle_service
        pip install -r requirements.txt

    - name: Run tests for salle_service
      run: |
        cd salle_service
        python manage.py test

    # ⬇️ Helm upgrade: se fait uniquement si les tests passent
    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Helm upgrade
      run: |
        helm upgrade --install my-app ./helm-chart --namespace default

