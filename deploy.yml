name: CI/CD to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push reservation image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/reservation_service ./reservation_service
        docker push ${{ secrets.DOCKER_USERNAME }}/reservation_service

    - name: Build and Push salle image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/salle_service ./salle_service
        docker push ${{ secrets.DOCKER_USERNAME }}/salle_service

    - name: Set up Kubeconfig
      run: |
        mkdir ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

    - name: Install Helm
      uses: azure/setup-helm@v3

    - name: Helm Upgrade
      run: |
        helm upgrade --install reservation ./helm/reservation
        helm upgrade --install salle ./helm/salle
